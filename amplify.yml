version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node 20+. The Amplify build image ships nvm; installing
        # pins the version here rather than relying on the image default.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Vite builds to dist/. Create React App used build/, so this must be
    # updated in the Amplify console too if the console settings win.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# NOTE: this customHeaders block is NOT currently taking effect. Verified
# against the live site: the resume PDF comes back with no X-Robots-Tag and
# the assets carry Amplify's default cache-control, not the values below.
# Amplify honours the build phases above but appears to ignore these, so the
# same rules must be entered in the Amplify console under
# App settings -> Custom headers, which is authoritative. Kept here as the
# source of truth for what the console should contain.
customHeaders:
  # The resume PDF carries a phone number, so keep it out of search results.
  # Deliberately NOT paired with a robots.txt Disallow: a disallowed URL is
  # never fetched, so the crawler never sees this header, and the URL can still
  # surface in results as a bare link. Allowing the fetch is what lets noindex
  # be obeyed. This does not stop a scraper that follows the link from the page.
  - pattern: '/ParkerBillingerResume.pdf'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex'

  # Hashed asset filenames change on every build, so they can be cached hard.
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
